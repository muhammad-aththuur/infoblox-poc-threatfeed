name: Build PhishTank TIDE Feed

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phishtank-feed-update
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with main
        run: |
          git checkout main
          git pull --rebase origin main

            - name: Download and convert PhishTank feed
        run: |
          python3 - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          import urllib.error
          import ipaddress
          import re

          from urllib.parse import urlsplit
          from datetime import datetime, timezone

          PROFILE = "PTM_PHISHTANK"
          PROPERTY = "Phishing_Phish"
          MAX_RECORDS = 50000

          SOURCES = [
              (
                  "https://data.phishtank.com/data/online-valid.csv",
                  "csv"
              ),
              (
                  "http://data.phishtank.com/data/online-valid.csv",
                  "csv"
              ),
              (
                  "https://data.phishtank.com/data/online-valid.json",
                  "json"
              ),
              (
                  "http://data.phishtank.com/data/online-valid.json",
                  "json"
              )
          ]

          USER_AGENT = "phishtank/infoblox-poc-ptm"

          def tide_time(value):
              if value:
                  try:
                      dt = datetime.fromisoformat(
                          value.replace("Z", "+00:00")
                      )

                      return dt.astimezone(
                          timezone.utc
                      ).strftime("%Y%m%dT%H%M%SZ")

                  except Exception:
                      pass

              return datetime.now(
                  timezone.utc
              ).strftime("%Y%m%dT%H%M%SZ")


          def download_feed():
              last_error = None

              for url, feed_type in SOURCES:

                  print("")
                  print(f"Trying: {url}")

                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": USER_AGENT,
                              "Accept": "*/*"
                          }
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=180
                      ) as response:

                          raw = response.read()

                      print(
                          f"SUCCESS: downloaded "
                          f"{len(raw)} bytes"
                      )

                      return raw, feed_type, url

                  except Exception as e:
                      last_error = e
                      print(
                          f"FAILED: {type(e).__name__}: {e}"
                      )

              raise RuntimeError(
                  f"All PhishTank sources failed. "
                  f"Last error: {last_error}"
              )


          raw, feed_type, source_used = download_feed()

          print("")
          print(f"Using source: {source_used}")
          print(f"Feed type: {feed_type}")


          if feed_type == "json":

              data = json.loads(
                  raw.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              if not isinstance(data, list):
                  raise RuntimeError(
                      "Unexpected PhishTank JSON structure."
                  )

              items = data


          else:

              text = raw.decode(
                  "utf-8-sig",
                  errors="replace"
              )

              reader = csv.DictReader(
                  io.StringIO(text)
              )

              items = list(reader)


          print(
              f"Parsed {len(items)} PhishTank records."
          )


          records_by_host = {}


          for item in items:

              verified = str(
                  item.get("verified", "yes")
              ).lower()

              online = str(
                  item.get("online", "yes")
              ).lower()

              if verified != "yes":
                  continue

              if online != "yes":
                  continue


              url = str(
                  item.get("url", "")
              ).strip()

              if not url:
                  continue


              try:
                  parsed = urlsplit(url)

                  host = (
                      parsed.hostname or ""
                  ).lower().rstrip(".")

              except Exception:
                  continue


              if not host:
                  continue


              try:
                  host = host.encode(
                      "idna"
                  ).decode("ascii")
              except UnicodeError:
                  continue


              if len(host) > 253:
                  continue


              try:
                  ipaddress.ip_address(host)
                  continue
              except ValueError:
                  pass


              if "." not in host:
                  continue


              labels = host.split(".")

              invalid = any(
                  len(label) > 63
                  or not re.fullmatch(
                      r"[a-z0-9-]+",
                      label
                  )
                  or label.startswith("-")
                  or label.endswith("-")

                  for label in labels
              )

              if invalid:
                  continue


              detected = tide_time(
                  item.get("verification_time")
                  or item.get("submission_time")
              )


              record = {
                  "host": host,
                  "property": PROPERTY,
                  "detected": detected
              }


              existing = records_by_host.get(host)

              if (
                  existing is None
                  or detected > existing["detected"]
              ):
                  records_by_host[host] = record


          records = list(
              records_by_host.values()
          )

          records.sort(
              key=lambda r: r["detected"],
              reverse=True
          )

          records = records[:MAX_RECORDS]


          if not records:
              raise RuntimeError(
                  "PhishTank downloaded successfully, "
                  "but zero valid DNS host indicators "
                  "were generated."
              )


          output = {
              "feed": {
                  "profile": PROFILE,
                  "record_type": "host",
                  "record": records
              }
          }


          with open(
              "phishtank-tide.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2
              )


          sample_hosts = [
              record["host"]
              for record in records[:20]
          ]


          with open(
              "phishtank-sample-hosts.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for host in sample_hosts:
                  f.write(host + "\n")


          print("")
          print(
              f"Generated {len(records)} unique "
              "TIDE host indicators."
          )

          print("")
          print("Sample hosts:")

          for host in sample_hosts:
              print(f"  {host}")

          PY

      - name: Commit generated TIDE feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add phishtank-tide.json
          git add phishtank-sample-hosts.txt

          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Update PhishTank TIDE feed"
            git push origin HEAD:main
          fi
