name: Build PhishTank TIDE Feed

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phishtank-feed-update
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with main
        run: |
          git checkout main
          git pull --rebase origin main

      - name: Download and convert PhishTank feed
        run: |
          python3 - <<'PY'
          import csv
          import gzip
          import io
          import ipaddress
          import json
          import re
          import urllib.request

          from urllib.parse import urlsplit
          from datetime import datetime, timezone

          PROFILE = "PTM_PHISHTANK"
          PROPERTY = "Phishing_Phish"
          MAX_RECORDS = 50000

          SOURCES = [
              (
                  "http://data.phishtank.com/data/online-valid.csv",
                  "csv",
                  False
              ),
              (
                  "http://data.phishtank.com/data/online-valid.csv.gz",
                  "csv",
                  True
              ),
              (
                  "http://data.phishtank.com/data/online-valid.json",
                  "json",
                  False
              ),
              (
                  "http://data.phishtank.com/data/online-valid.json.gz",
                  "json",
                  True
              )
          ]

          USER_AGENT = "phishtank/muhammad-aththuur-infoblox-poc"

          def tide_time(value):
              if value:
                  try:
                      dt = datetime.fromisoformat(
                          str(value).replace("Z", "+00:00")
                      )

                      return dt.astimezone(
                          timezone.utc
                      ).strftime("%Y%m%dT%H%M%SZ")

                  except Exception:
                      pass

              return datetime.now(
                  timezone.utc
              ).strftime("%Y%m%dT%H%M%SZ")


          def download_feed():
              last_error = None

              for url, feed_type, compressed in SOURCES:

                  print("")
                  print(f"Trying: {url}")

                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": USER_AGENT,
                              "Accept": "*/*"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          raw = response.read()

                      if compressed:
                          raw = gzip.decompress(raw)

                      print(
                          f"SUCCESS: downloaded {len(raw)} bytes"
                      )

                      return raw, feed_type, url

                  except Exception as exc:

                      last_error = exc

                      print(
                          f"FAILED: "
                          f"{type(exc).__name__}: {exc}"
                      )

              raise RuntimeError(
                  "All PhishTank download sources failed. "
                  f"Last error: {last_error}"
              )


          raw, feed_type, source_used = download_feed()

          print("")
          print(f"Using source: {source_used}")
          print(f"Feed type: {feed_type}")


          if feed_type == "json":

              items = json.loads(
                  raw.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              if not isinstance(items, list):

                  raise RuntimeError(
                      "Unexpected PhishTank JSON structure."
                  )

          else:

              text = raw.decode(
                  "utf-8-sig",
                  errors="replace"
              )

              reader = csv.DictReader(
                  io.StringIO(text)
              )

              items = list(reader)


          print(
              f"Parsed {len(items)} PhishTank records."
          )


          records_by_host = {}


          for item in items:

              verified = str(
                  item.get("verified", "")
              ).strip().lower()

              online = str(
                  item.get("online", "")
              ).strip().lower()


              if verified != "yes":
                  continue

              if online != "yes":
                  continue


              phishing_url = str(
                  item.get("url", "")
              ).strip()

              if not phishing_url:
                  continue


              try:

                  parsed = urlsplit(phishing_url)

                  host = (
                      parsed.hostname or ""
                  ).lower().rstrip(".")

              except Exception:

                  continue


              if not host:
                  continue


              # Convert IDN hostname ke punycode.
              try:

                  host = host.encode(
                      "idna"
                  ).decode("ascii")

              except UnicodeError:

                  continue


              # Maksimum panjang DNS hostname.
              if len(host) > 253:
                  continue


              # Skip IOC berupa IP address.
              try:

                  ipaddress.ip_address(host)
                  continue

              except ValueError:

                  pass


              # Harus hostname/FQDN.
              if "." not in host:
                  continue


              labels = host.split(".")


              invalid = any(

                  len(label) == 0

                  or len(label) > 63

                  or not re.fullmatch(
                      r"[a-z0-9-]+",
                      label
                  )

                  or label.startswith("-")

                  or label.endswith("-")

                  for label in labels
              )


              if invalid:
                  continue


              detected = tide_time(
                  item.get("verification_time")
                  or item.get("submission_time")
              )


              record = {
                  "host": host,
                  "property": PROPERTY,
                  "detected": detected
              }


              existing = records_by_host.get(host)


              if (
                  existing is None
                  or detected > existing["detected"]
              ):

                  records_by_host[host] = record


          records = list(
              records_by_host.values()
          )


          records.sort(
              key=lambda record: record["detected"],
              reverse=True
          )


          records = records[:MAX_RECORDS]


          if not records:

              raise RuntimeError(
                  "PhishTank was downloaded, but zero "
                  "valid hostname indicators were generated."
              )


          print("")
          print(
              f"Generated {len(records)} unique "
              "hostname indicators."
          )


          # ==================================================
          # GENERATE JSON
          # Untuk TIDE API / File Upload
          # ==================================================

          output = {
              "feed": {
                  "profile": PROFILE,
                  "record_type": "host",
                  "record": records
              }
          }


          with open(
              "phishtank-tide.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          print(
              "Generated: phishtank-tide.json"
          )


          # ==================================================
          # GENERATE CSV
          # Untuk TIDE URL Upload
          # ==================================================

          csv_fields = [
              "record_type",
              "host",
              "profile",
              "detected",
              "property"
          ]


          with open(
              "phishtank-tide.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as file:

              writer = csv.DictWriter(
                  file,
                  fieldnames=csv_fields
              )

              writer.writeheader()


              for record in records:

                  writer.writerow({
                      "record_type": "host",
                      "host": record["host"],
                      "profile": PROFILE,
                      "detected": record["detected"],
                      "property": record["property"]
                  })


          print(
              "Generated: phishtank-tide.csv"
          )


          # ==================================================
          # GENERATE SAMPLE DOMAIN
          # Untuk mempermudah testing POC
          # ==================================================

          sample_hosts = [
              record["host"]
              for record in records[:20]
          ]


          with open(
              "phishtank-sample-hosts.txt",
              "w",
              encoding="utf-8"
          ) as file:

              for host in sample_hosts:

                  file.write(
                      host + "\n"
                  )


          print(
              "Generated: phishtank-sample-hosts.txt"
          )


          print("")
          print("Sample hosts:")


          for host in sample_hosts:

              print(
                  f"  {host}"
              )


          PY


      - name: Commit generated TIDE feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add phishtank-tide.json
          git add phishtank-tide.csv
          git add phishtank-sample-hosts.txt

          if git diff --cached --quiet; then
            echo "No feed changes."
            exit 0
          fi

          git commit -m "Update PhishTank TIDE feed"

          git push origin HEAD:main
